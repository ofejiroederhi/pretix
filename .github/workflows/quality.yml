# Quality gate: lint, test, coverage threshold, optional Docker test run.
# Supports distinction-level CI/CD and test orchestration evidence.
name: Quality Gate

on:
  push:
    branches: [master]
    paths-ignore:
      - 'doc/**'
      - 'src/pretix/locale/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'doc/**'
      - 'src/pretix/locale/**'

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip3 install uv && uv pip install --system -e ".[dev]" psycopg2-binary
      - name: isort
        run: isort -c .
        working-directory: ./src
      - name: flake8
        run: flake8 .
        working-directory: ./src

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.database }})
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11"]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pretix
        options: >-
          --health-cmd "pg_isready -U postgres -d pretix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y gettext
      - name: Install Python dependencies
        run: pip3 install uv && uv pip install --system -e ".[dev]" psycopg2-binary
      - name: Run checks
        run: python manage.py check
        working-directory: ./src
      - name: Install JS dependencies
        working-directory: ./src
        run: make npminstall
      - name: Compile
        working-directory: ./src
        run: make all compress
      - name: Run tests
        working-directory: ./src
        run: PRETIX_CONFIG_FILE=tests/ci_${{ matrix.database }}.cfg py.test -n 2 -p no:sugar --cov=./ --cov-report=term-missing --cov-report=xml --cov-fail-under=75 tests --maxfail=50
      - name: Run concurrency tests
        working-directory: ./src
        run: PRETIX_CONFIG_FILE=tests/ci_${{ matrix.database }}.cfg py.test tests/concurrency_tests/ --reuse-db -m "not performance"
        if: matrix.database == 'postgres'

  docker-test:
    name: Docker test run
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image
        run: docker build -f Dockerfile.test -t pretix-test:latest .
      - name: Run tests in container
        run: docker run --rm pretix-test:latest bash -c "cd /pretix/src && PRETIX_CONFIG_FILE=tests/ci_sqlite.cfg pytest tests/ -m 'not slow and not performance' -p no:sugar --maxfail=20 -q"
