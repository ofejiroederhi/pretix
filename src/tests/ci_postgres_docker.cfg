# PostgreSQL config for running tests inside Docker Compose.
# Use with: PRETIX_CONFIG_FILE=tests/ci_postgres_docker.cfg
# Requires the compose "db" service. Set in .env: POSTGRES_USER=pretix, POSTGRES_PASSWORD=<same>
# so the db service and this config use the same credentials.
[database]
backend=postgresql_psycopg2
name=pretix
user=pretix
password=pretix
host=db
port=5432
